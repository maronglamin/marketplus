pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
}

plugins {
  id("com.facebook.react.settings")
}

def requestedTasks = gradle.startParameter.taskNames.join(" ").toLowerCase()
def isReleaseLikeBuild =
  requestedTasks.contains("release") ||
  requestedTasks.contains("bundle") ||
  (System.getenv("NODE_ENV") ?: "").equalsIgnoreCase("production") ||
  ((System.getenv("EAS_BUILD_PROFILE") ?: "").toLowerCase() in ["preview", "production"])

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    // Expo SDK 52 uses script-based autolinking (no expo-autolinking-settings plugin).
    ex.autolinkLibrariesFromCommand([
      "node",
      "--no-warnings",
      "--eval",
      "require(require.resolve('expo-modules-autolinking', { paths: [require.resolve('expo/package.json')] }))(process.argv.slice(1))",
      "react-native-config",
      "--json",
      "--platform",
      "android"
    ])
  }
}

rootProject.name = 'SNAP'

apply from: new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('expo/package.json')")
  }.standardOutput.asText.get().trim(),
  "../scripts/autolinking.gradle"
)

include ':app'
if (isReleaseLikeBuild) {
  useExpoModules(exclude: [
    "expo-dev-client",
    "expo-dev-launcher",
    "expo-dev-menu",
    "expo-dev-menu-interface"
  ])
} else {
  useExpoModules()
}

includeBuild(new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
  }.standardOutput.asText.get().trim()
).getParentFile())
