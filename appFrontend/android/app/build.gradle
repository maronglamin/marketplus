apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Keep the same drive/root Gradle was launched from.
// Using canonical paths breaks Windows builds started from a subst drive (e.g. R:)
// because other tooling may stay on R: while canonicalPath resolves to C:.
def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
// Windows: hermesc must be hermesc.exe or "Failed to open file" can occur
def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
def hermescBin = isWindows ? "hermesc.exe" : "hermesc"
def reactNativePath = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath()

// Optional local signing secrets (gitignored). Env vars override this file.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    root = file(projectRoot).getAbsoluteFile()
    // Use explicit absolute entry path to avoid Metro resolution issues on Windows (./index.ts from appFrontend/.)
    entryFile = file(projectRoot + "/index.ts")
    reactNativeDir = new File(reactNativePath).getAbsoluteFile()
    hermesCommand = reactNativePath + "/sdks/hermesc/%OS-BIN%/" + hermescBin
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use wrapper so bundle runs with cwd = PROJECT_ROOT (canonical path), fixing Metro ./index.ts resolution on Windows when building from C:\mp
    cliFile = file(projectRoot + "/scripts/bundle-export-wrapper.js")
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

// Ensure bundle output dirs exist before running (helps avoid "Failed to open file" on Windows)
tasks.findByName("createBundleReleaseJsAndAssets")?.configure { task ->
    task.doFirst {
        def buildDir = task.project.layout.buildDirectory.get().asFile
        [ "generated/assets/react/Release", "generated/assets/createBundleReleaseJsAndAssets" ].each { sub ->
            new File(buildDir, sub).mkdirs()
        }
    }
    task.environment("PROJECT_ROOT", projectRoot)
    task.environment("NODE_ENV", System.getenv("NODE_ENV") ?: "production")
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'biz.cloudnexus.snap.app'
    defaultConfig {
        applicationId 'biz.cloudnexus.snap.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "1.0.2"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Configure a release signing config if keystore properties are provided via
        // Gradle properties or environment variables. Falls back to debug if absent.
        def releaseKeystorePath = (System.getenv('MYAPP_UPLOAD_STORE_FILE') ?: keystoreProperties.getProperty('MYAPP_UPLOAD_STORE_FILE') ?: findProperty('MYAPP_UPLOAD_STORE_FILE'))
        def releaseKeyAlias = (System.getenv('MYAPP_UPLOAD_KEY_ALIAS') ?: keystoreProperties.getProperty('MYAPP_UPLOAD_KEY_ALIAS') ?: findProperty('MYAPP_UPLOAD_KEY_ALIAS'))
        // Passwords: env > keystore.properties only (never commit in gradle.properties)
        def releaseStorePassword = (System.getenv('MYAPP_UPLOAD_STORE_PASSWORD') ?: keystoreProperties.getProperty('MYAPP_UPLOAD_STORE_PASSWORD'))
        def releaseKeyPassword = (System.getenv('MYAPP_UPLOAD_KEY_PASSWORD') ?: keystoreProperties.getProperty('MYAPP_UPLOAD_KEY_PASSWORD'))
        if (releaseKeystorePath && releaseKeyAlias && releaseStorePassword && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Use release signing if configured; otherwise fall back to debug to avoid build breaks.
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Fail fast if the JS bundle never made it into the AAB (avoids Play-only jniLoadScriptFromAssets crashes).
afterEvaluate {
    def packageReleaseBundle = tasks.findByName("packageReleaseBundle")
    if (packageReleaseBundle != null) {
        packageReleaseBundle.doLast {
            def aab = file("${layout.buildDirectory.get().asFile}/outputs/bundle/release/app-release.aab")
            if (!aab.exists()) {
                return
            }
            def zip = new java.util.zip.ZipFile(aab)
            try {
                def bundleEntry = null
                zip.entries().each { e ->
                    if (!e.isDirectory() && e.name.endsWith("index.android.bundle")) {
                        bundleEntry = e
                    }
                }
                if (bundleEntry == null) {
                    throw new GradleException(
                        "Release AAB is missing assets index.android.bundle — release builds will crash in CatalystInstanceImpl.jniLoadScriptFromAssets. Run a clean build: .\\gradlew clean :app:createBundleReleaseJsAndAssets :app:bundleRelease"
                    )
                }
                if (bundleEntry.size < 1024) {
                    throw new GradleException(
                        "Release AAB index.android.bundle is only ${bundleEntry.size} bytes — bundle step likely failed."
                    )
                }
            } finally {
                zip.close()
            }
        }
    }
}
