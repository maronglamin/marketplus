# Loaded from /etc/nginx/conf.d/ (http context).
# WebSocket upgrade mapping + upstream for the SNAP consumer API.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream snap_backend {
    server 127.0.0.1:BACKEND_PORT;
    keepalive 32;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml;
