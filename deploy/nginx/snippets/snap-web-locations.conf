# Shared location blocks for snap.cloudnexus.biz (static CRA + API proxy).
# Placeholders: WEB_ROOT, UPLOADS_ROOT, PUBLIC_ROOT

client_max_body_size 50m;
root WEB_ROOT;
index index.html;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
}

# Socket.IO (rides, rentals, live location)
location /socket.io/ {
    proxy_pass http://snap_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# Payment webhooks — do not buffer the request body
location ^~ /api/payments/ {
    include snippets/snap-proxy-params.conf;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://snap_backend;
}

location /api/ {
    include snippets/snap-proxy-params.conf;
    proxy_set_header Connection "";
    proxy_pass http://snap_backend;
}

# Uploads and backend public assets served directly by nginx
location /uploads/ {
    alias UPLOADS_ROOT/;
    expires 7d;
    access_log off;
}

location /public/ {
    alias PUBLIC_ROOT/;
    expires 7d;
    access_log off;
}

# Hashed CRA assets
location /static/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
}

location = /index.html {
    expires -1;
}

location = /service-worker.js {
    expires -1;
}

location = /push-sw.js {
    expires -1;
}

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}
